<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Yüz kalibrasyonu</title></head>
<body>
<pre id="cikti">Çalışıyor…</pre>
<script type="module">
// Yüz ölçümünün kalibrasyon testi.
// Gerçek fotoğraf çiftleri (düz + gülümseme) üzerinde:
//  1) sağlıklı gülümsemede yanlış alarm var mı (özgüllük)
//  2) ağız köşesine yapay düşme eklenince yakalıyor mu, tarafı doğru mu (duyarlılık)
//  3) baş eğikliği ve uzaklık değişince sonuç bozuluyor mu (dayanıklılık)
import { koseYukseklikleri, hesapla, yuzRisk } from '../app/js/face.js';

const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const vision = await import(`${MP}/vision_bundle.mjs`);
const fileset = await vision.FilesetResolver.forVisionTasks(`${MP}/wasm`);
const lm = await vision.FaceLandmarker.createFromOptions(fileset, {
  baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' },
  runningMode: 'IMAGE', numFaces: 1, outputFaceBlendshapes: true,
});

const resimYukle = src => new Promise((ok, hata) => { const i = new Image(); i.onload = () => ok(i); i.onerror = hata; i.src = src; });
const tuval = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

function yarim(img, sag) {
  const w = Math.floor(img.width / 2), c = tuval(w, img.height);
  c.getContext('2d').drawImage(img, sag ? w : 0, 0, w, img.height, 0, 0, w, img.height);
  return c;
}

function dondur(src, derece, olcek = 1) {
  const c = tuval(src.width, src.height), x = c.getContext('2d');
  x.fillStyle = '#c8c8c8'; x.fillRect(0, 0, c.width, c.height);
  x.translate(c.width / 2, c.height / 2); x.rotate(derece * Math.PI / 180); x.scale(olcek, olcek);
  x.drawImage(src, -src.width / 2, -src.height / 2);
  return c;
}

// Ağız köşesini aşağı iten yumuşak (Gauss) deformasyon. genlik ve sigma piksel.
function kosedusur(src, kose, genlik, sigma) {
  const w = src.width, h = src.height;
  const kaynak = src.getContext('2d').getImageData(0, 0, w, h);
  const c = tuval(w, h), x = c.getContext('2d'), hedef = x.createImageData(w, h);
  const s2 = 2 * sigma * sigma;
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    const dx = px - kose.x, dy = py - kose.y;
    const g = Math.exp(-(dx * dx + dy * dy) / s2);
    const sy = Math.min(h - 1, Math.max(0, Math.round(py - genlik * g)));
    const i = (py * w + px) * 4, j = (sy * w + px) * 4;
    hedef.data[i] = kaynak.data[j]; hedef.data[i + 1] = kaynak.data[j + 1]; hedef.data[i + 2] = kaynak.data[j + 2]; hedef.data[i + 3] = 255;
  }
  x.putImageData(hedef, 0, 0);
  return c;
}

function olc(c) {
  const r = lm.detect(c);
  const n = r.faceLandmarks?.[0];
  if (!n) return null;
  const bl = ad => r.faceBlendshapes?.[0]?.categories?.find(k => k.categoryName === ad)?.score ?? 0;
  return { n, k: koseYukseklikleri(n, c.width, c.height), b: { sag: bl('mouthSmileRight'), sol: bl('mouthSmileLeft') }, w: c.width, h: c.height };
}

function sonucla(notrC, gulC) {
  const a = olc(notrC), b = olc(gulC);
  if (!a || !b) return { yuzYok: true };
  const s = hesapla(a.k, b.k, b.b, 2, 'test');
  return { ...s, risk: yuzRisk(s) };
}

const satirlar = [];
for (let i = 1; i <= 4; i++) {
  const img = await resimYukle(`yuzler/cift-${i}.jpg`);
  const notr = yarim(img, false), gul = yarim(img, true);
  const g = olc(gul);
  if (!g) { satirlar.push({ kisi: i, durum: 'yüz bulunamadı' }); continue; }
  // Gözler arası mesafe (piksel) ve köşe konumları
  const p = j => ({ x: g.n[j].x * gul.width, y: g.n[j].y * gul.height });
  const iod = Math.hypot(p(263).x - p(33).x, p(263).y - p(33).y);
  const kayit = (kosul, beklenen, s) => satirlar.push({ kisi: i, kosul, beklenen, ...s });

  kayit('sağlıklı', 'normal', sonucla(notr, gul));
  for (const d of [-15, -8, 8, 15]) kayit(`sağlıklı, baş ${d}° eğik`, 'normal', sonucla(dondur(notr, d), dondur(gul, d)));
  kayit('sağlıklı, baş yalnız gülümsemede 10° döndü', 'normal', sonucla(notr, dondur(gul, 10)));
  kayit('sağlıklı, gülümsemede telefon uzaklaştı (%80)', 'normal', sonucla(notr, dondur(gul, 0, 0.8)));

  for (const taraf of ['sağ', 'sol']) {
    const kose = p(taraf === 'sağ' ? 61 : 291);   // kişinin sağı = görüntünün solu
    for (const oran of [0.05, 0.10, 0.15, 0.20, 0.30]) {
      const gulD = kosedusur(gul, kose, oran * iod, 0.22 * iod);
      const notrD = kosedusur(notr, { x: kose.x, y: kose.y }, oran * 0.3 * iod, 0.22 * iod);
      kayit(`${taraf} köşe düşük, ${Math.round(oran * 100)}% göz arası`, oran >= 0.15 ? 'inme' : 'hafif', { ...sonucla(notrD, gulD), dogruTaraf: taraf });
    }
    const gulD = kosedusur(gul, kose, 0.2 * iod, 0.22 * iod);
    kayit(`${taraf} köşe düşük 20% + baş 10° eğik`, 'inme', { ...sonucla(dondur(kosedusur(notr, kose, 0.06 * iod, 0.22 * iod), 10), dondur(gulD, 10)), dogruTaraf: taraf });
  }
}
window.SONUC = satirlar;
document.getElementById('cikti').textContent = JSON.stringify(satirlar, null, 1);
window.BITTI = true;
</script>
</body></html>
